<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อสั่งซื้อสินค้า Body Scent">
  <link rel="stylesheet" href="style.css">
  <style>
    /* สไตล์เฉพาะหน้าสั่งซื้อ */
    .page-head {
      padding: var(--space-6) 0 var(--space-5);
      background: linear-gradient(180deg, var(--ivory) 0%, var(--cream) 100%);
      text-align: center;
    }
    .page-head h1 {
      margin-bottom: 0;
      font-size: clamp(2rem, 4.5vw, 3rem);
    }
    .page-head p { margin: 0 auto; }

    .form-wrap {
      max-width: 560px;
      margin: 0 auto;
    }
    .field { margin-bottom: var(--space-4); }
    .textarea {
      resize: vertical;
      min-height: 5.5rem;
      line-height: 1.8;
    }
    .input::placeholder,
    .textarea::placeholder {
      color: var(--beige-deep);
      opacity: 0.8;
    }
    .field__hint {
      margin: 0.5rem 0 0;
      font-size: 0.85rem;
      color: var(--beige-deep);
    }
    .field__hint a {
      border-bottom: 1px solid var(--line);
      color: var(--ink-soft);
    }
    .field__hint a:hover { border-bottom-color: var(--bronze); }
    .form-actions { margin-top: var(--space-5); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>สั่งซื้อสินค้า</h1>
        <hr class="rule">
        <p>กรอกข้อมูลด้านล่าง แล้วกดยืนยันสั่งซื้อ</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form class="form-wrap" id="orderForm">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input class="input" type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line ID</label>
            <input class="input" type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input class="input" type="text" id="items" name="items" required>
            <p class="field__hint">เติมให้อัตโนมัติจากสินค้าที่เลือก <a href="product.html">เลือกสินค้าอื่น</a></p>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input class="input" type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea class="textarea" id="note" name="note" rows="3" placeholder="เช่น ที่อยู่จัดส่ง หรือข้อความถึงร้าน"></textarea>
          </div>

          <div class="form-actions">
            <button class="btn btn--solid btn--block" type="submit">ยืนยันสั่งซื้อ</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="logo" href="index.html">Body Scent</a>
      <p>กลิ่นหอมที่สะท้อนตัวตนของคุณ</p>
      <ul class="site-footer__links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้าทั้งหมด</a></li>
      </ul>
      <p>&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
